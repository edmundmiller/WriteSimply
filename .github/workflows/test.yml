name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vale-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Vale
        run: .agents/setup
      - name: Test package and fixtures
        run: VALE="$HOME/.local/bin/vale" python3 tests/test.py
      - name: Build release archive
        run: python3 scripts/package.py dist/WriteSimply.zip
